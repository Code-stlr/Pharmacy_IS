<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-label="Patient search — retrospective wireframe"><style>text{font-family:Arial,sans-serif;fill:#263746} .box{fill:white;stroke:#176b62;stroke-width:2}.link{fill:none;stroke:#6b7280;stroke-width:1.5}</style><rect width="100%" height="100%" fill="#f5f8f7"/><text x="40" y="50" font-size="30">Patient search — retrospective wireframe</text><text x="40" y="88" font-size="20">Captured 2026-11-08 from the implemented workflow; not a historical Week 3 artifact.</text><rect x="40" y="130" width="1020" height="80" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="65" y="176" font-size="24">Navigation: Patients / Inventory / Prescriptions / History</text><rect x="40" y="235" width="1020" height="80" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="65" y="281" font-size="24">Search: name, reference or phone</text><rect x="40" y="340" width="1020" height="80" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="65" y="386" font-size="24">Results: reference / full name / birth date</text><rect x="40" y="445" width="1020" height="80" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="65" y="491" font-size="24">Action: create or edit patient</text><rect x="40" y="550" width="1020" height="80" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="65" y="596" font-size="24">Empty state: no matching records</text></svg>